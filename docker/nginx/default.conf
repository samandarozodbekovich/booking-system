# Resolve "web" through Docker's DNS on every request (not once at startup),
# so nginx keeps working after the web container is recreated and gets a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- HTTP ----------
server {
    listen 80;
    server_name _;  # SSL: replace with your domain, e.g. example.com www.example.com

    client_max_body_size 10M;

    # ---------- SSL: Let's Encrypt domain verification (uncomment for certbot) ----------
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # ---------- SSL: once the certificate exists, redirect all HTTP to HTTPS ----------
    # Uncomment this block and delete (or comment out) the two locations below it.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

